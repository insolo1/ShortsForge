version: "3.8"

services:
  db:
    image: postgres:13
    container_name: db-app
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  mitsubishi-docs:
    build:
      context: ./mitsubishi
      dockerfile: Dockerfile.mitsubishi
    container_name: mitsubishi-docs
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - ./mitsubishi:/app
    networks:
      - app_network

  anamnesis:
    build:
      context: ./anamnesis
      dockerfile: Dockerfile.anamnesis
    container_name: anamnesis
    restart: unless-stopped
    ports:
      - "8300:8000"
    volumes:
      - anamnesis_data:/app/data
    env_file:
      - .env
    environment:
      - TZ=Asia/Yekaterinburg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  videobot:
    build:
      context: ./videobot
      dockerfile: Dockerfile
    container_name: videobot
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - ./videobot/app:/app/app
      - ./videobot/static:/app/static
      - ./videobot/fonts:/app/fonts
      - ./videobot/.env:/app/.env
      - ./videobot/client_secret.json:/app/client_secret.json:ro
      - ./videobot/users.json:/app/users.json
      - ./videobot/sessions.json:/app/sessions.json
      - ./videobot/presets.json:/app/presets.json
      - ./videobot/uploads:/app/uploads
      - ./videobot/output:/app/output
      - ./videobot/tokens:/app/tokens
      - ./videobot/google_credentials:/app/google_credentials
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - PYTHONPATH=/app
      - TZ=Asia/Yekaterinburg
    networks:
      - app_network

  tiktokbot:
    build:
      context: ./tiktokbot
      dockerfile: Dockerfile
    container_name: tiktokbot
    restart: unless-stopped
    volumes:
      - ./tiktokbot/cookies:/app/cookies
      - ./tiktokbot/streak_bot.db:/app/streak_bot.db
      - ./tiktokbot/.env:/app/.env:ro
    environment:
      - TZ=Asia/Yekaterinburg
    networks:
      - app_network

volumes:
  postgres_data:
  anamnesis_data:

networks:
  app_network:
    driver: bridge
