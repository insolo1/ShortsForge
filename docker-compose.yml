services:
  videobot:
    build: .
    container_name: videobot
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./tokens:/app/tokens
      - ./google_credentials:/app/google_credentials
      - ./saved:/app/saved
      - ./.env:/app/.env:ro
      - ./client_secret.json:/app/client_secret.json:ro
      - whisper_cache:/app/.cache/whisper
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - PYTHONPATH=/app
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - TZ=Europe/Moscow
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    devices:
      # Для Raspberry Pi V4L2 аппаратного кодирования
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
    # Требуется nvidia-container-toolkit на хосте:
    #   sudo apt install nvidia-container-toolkit && sudo systemctl restart docker
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]

volumes:
  whisper_cache:
