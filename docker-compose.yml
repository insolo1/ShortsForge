services:
  videobot:
    build: .
    image: videobot
    container_name: videobot
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - ./.env:/app/.env
      - ./users.json:/app/users.json
      - ./sessions.json:/app/sessions.json
      - ./presets.json:/app/presets.json
      - ./jobs.json:/app/jobs.json
      - ./job_logs.json:/app/job_logs.json
      - ./settings.json:/app/settings.json
      - ./api_keys.json:/app/api_keys.json
      - ./fonts:/app/fonts
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./saved:/app/saved
      - ./tokens:/app/tokens
      - ./google_credentials:/app/google_credentials
      - ./cache/whisper:/app/.cache/whisper
    # Контейнер работает от uid 1000. Папки uploads/output должны быть ему доступны:
    #   sudo chown -R 1000:1000 uploads output saved tokens google_credentials cache
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - PYTHONPATH=/app
      - WHISPER_CACHE_DIR=/app/.cache/whisper
    # Для использования GPU (CUDA) в контейнере:
    # - установи nvidia-container-toolkit на хосте
    # - раскомментируй блок ниже
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
