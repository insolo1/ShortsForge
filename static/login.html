<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Video to Shorts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center">
    <div class="card rounded-2xl p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
            Вход в систему
        </h1>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Логин</label>
                <input type="text" id="username" required
                    class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-purple-500 focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm text-gray-400 mb-2">Пароль</label>
                <input type="password" id="password" required
                    class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-purple-500 focus:outline-none">
            </div>
            
            <button type="submit" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 transition">
                Войти
            </button>
        </form>
        
        <p id="error-msg" class="text-red-400 text-sm mt-4 text-center hidden"></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.detail || 'Ошибка входа';
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.textContent = 'Ошибка соединения';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
