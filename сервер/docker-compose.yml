services:
  web:
    build: .
    container_name: web-app
    entrypoint: ["wait-for-it.sh", "db", "5432", "python", "manage.py"]
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_APP=manage.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  worker:
    build: .
    container_name: worker-app
    restart: always
    entrypoint: ["wait-for-it.sh", "db", "5432", "python", "-u", "oblig_worker/main.py"]
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Yekaterinburg
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: postgres:13
    container_name: db-app
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  mitsubishi-docs:
    build:
      context: ./mitsubishi
      dockerfile: Dockerfile.mitsubishi
    container_name: mitsubishi-docs
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - ./mitsubishi:/app
    networks:
      - app_network

  videobot:
    build:
      context: ./videobot
      dockerfile: Dockerfile
    container_name: videobot
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - ./videobot/app:/app/app
      - ./videobot/static:/app/static
      - ./videobot/.env:/app/.env:ro
      - ./videobot/client_secret.json:/app/client_secret.json:ro
      - ./videobot/users.json:/app/users.json:ro
      - ./videobot/sessions.json:/app/sessions.json
      - ./videobot/presets.json:/app/presets.json
      - ./videobot/uploads:/app/uploads
      - ./videobot/output:/app/output
      - ./videobot/tokens:/app/tokens
      - ./videobot/google_credentials:/app/google_credentials
      - ./videobot/saved:/app/saved
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - PYTHONPATH=/app
      - TZ=Asia/Yekaterinburg
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
